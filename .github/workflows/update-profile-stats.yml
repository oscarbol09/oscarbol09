name: Update Profile Stats
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Generate stats SVGs
        run: node .github/scripts/generate-stats.js
        env:
          GITHUB_USERNAME: oscarbol09
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update profile stats [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in stats SVGs."
          fi
